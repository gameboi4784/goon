<iframe id="game-iframe" src="https://games.crazygames.com/en_US/openfront-gsw/index.html?isNewUser=false&amp;v=1.354" title="Openfront" scrolling="no" allow="autoplay; payment; fullscreen; microphone; focus-without-user-activation *; screen-wake-lock; gamepad; clipboard-read; clipboard-write; accelerometer; gyroscope; " allowfullscreen="" sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-presentation allow-scripts allow-same-origin allow-downloads  allow-popups allow-popups-to-escape-sandbox" loading="eager" importance="high" data-hj-allow-iframe="true" style="border: 0px; margin: 0px; padding: 0px; width: 100%; height: 100%; position: absolute; top: 0px; left: 0px; user-select: none;"><p>Openfront.io is an IO battle game where you expand your territory, build up your economy, forge alliances, and drop bombs to dominate the map. <h2><strong>How to Play Openfront</strong></h2><p>Before jumping in, you'll choose how you want to play. You can dive into a solo game, create a private lobby, or join an existing one. From there, you pick your map. The selection is massive:</p><ul><li><span contenteditable="false"></span><strong>Large-scale maps</strong> cover regions like the World, North America, South America, Europe, Asia, Africa, and Oceania</li><li><span contenteditable="false"></span><strong>Regional maps</strong> get more specific with options like Britannia, Japan, Italy, Iceland, the Strait of Gibraltar, the Amazon River, the Gulf of St. Lawrence, New York City, East Asia, Australia, and many more</li><li><span contenteditable="false"></span><strong>Fantasy and alternate maps</strong> include Pangaea, Mars, Pluto, Deglaciated Antarctica, and arcade maps like Didier and Sierpinski</li><li><span contenteditable="false"></span>Or just hit <strong>Random</strong> and see where you land</li></ul><p>Difficulty options range from Easy all the way up to Impossible, so there's a setting for every skill level.</p><p><strong>Tabs &amp; Settings</strong></p><ul><li><span contenteditable="false"></span><strong>Play</strong> is where you launch into a game</li><li><span contenteditable="false"></span><strong>News</strong> keeps you updated on developer patches, bug fixes, and new features</li><li><span contenteditable="false"></span><strong>Leaderboard</strong> shows ranked data for individual players and clans, including games played, wins, and losses</li><li><span contenteditable="false"></span><strong>Settings</strong> lets you pick your flag, toggle special effects, choose territory skins, enable emojis, and set your default attack ratio so you're not adjusting the slider every time you spawn</li></ul><p><strong>Getting Started</strong></p><p>When you start the game, pick your starting location and begin claiming the empty territory around you. The map has three terrain types: plains, highlands, and mountains. Each one gets progressively harder to capture, so factor that into where you spawn. Your control panel sits in the bottom left and includes an attack slider that controls what percentage of your troops you send out. Keep an eye on your population bar, too. Green means your population is growing, yellow means it's shrinking, and growth peaks at around 41% of your max population.</p><p><strong>Who You'll Run Into</strong></p><p>As you expand, you'll start bumping into three types of entities. Bots are the weakest and can't build anything. Nations are NPC factions that can build infrastructure and launch bombs. Players are your real competition. You can form alliances with any of them, but if you betray an ally, you'll take a defense debuff for 30 seconds, so choose your moments carefully.</p><p><strong>Infrastructure</strong></p><p>Buildings are the backbone of your strategy:</p><ul><li><span contenteditable="false"></span><strong>Cities</strong> increase your max population by 25k</li><li><span contenteditable="false"></span><strong>Ports</strong> generate trade ships that grow your economy and let you build warships for attacking and raiding</li><li><span contenteditable="false"></span><strong>Factories</strong> connect cities and ports via train networks, generating gold with every run, especially when trading with neighbors and allies</li><li><span contenteditable="false"></span><strong>Defense posts</strong> fortify your borders and slow enemy pushes</li><li><span contenteditable="false"></span><strong>SAM launchers</strong> protect a small area from incoming nukes, and leveling them up increases their range</li><li><span contenteditable="false"></span><strong>Missile silos</strong> let you launch nuclear weapons</li></ul><p>Most buildings can be stacked to level them up, which works the same as having multiple copies of that building in different locations.</p><p><strong>Nuclear Weapons</strong></p><ul><li><span contenteditable="false"></span><strong>Atom bombs</strong> are small and precise, best used against specific targets</li><li><span contenteditable="false"></span><strong>Hydrogen bombs</strong> cover a much wider area and deal serious population damage</li><li><span contenteditable="false"></span><strong>MIRVs</strong> are the big ones, blanketing enemy territory with a spread of missiles</li></ul><h3>More Games Like This</h3><p>If you're able to take a break from playing Openfront, there are other <a class="tag-link" href="https://www.crazygames.com/t/battle" target="_blank">battle games</a> that are just as strategic. Have a go at <a class="game-link" href="https://www.crazygames.com/game/diepio" target="_blank">Diep.io</a> or <a class="game-link" href="https://www.crazygames.com/game/smash-karts" target="_blank">Smash Karts</a> for a bit more battle challenge.</p></iframe>
