<html>
    <head>
        <style>
            body, html {
                margin: 0;
                padding: 0;
            }
        </style>
    </head>
    <body>
        <div style="width:100%;height:100%;max-width:100%">
            <div id="game"></div>
        </div>
        <script>
            EJS_player = "#game";
            EJS_core = "snes";
            EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
            EJS_gameUrl = "https://gameboi4784.github.io/goon/m2dx.sfc";

            EJS_settings = {
                defaultControls: {
                    0: {
                        0: { value: "x", value2: "B" },                  // B
                        1: { value: "Shift", value2: "Y" },              // Y
                        2: { value: "space", value2: "SELECT" },         // SELECT
                        3: { value: "Enter", value2: "START" },          // START
                        8: { value: "z", value2: "A" },                  // A
                        9: { value: "c", value2: "X" },                  // X
                        10: { value: "a", value2: "LEFT_TOP_SHOULDER" }, // L
                        11: { value: "s", value2: "RIGHT_TOP_SHOULDER" } // R
                    }
                }
            };
        </script>
        <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
    </body>
</html>
